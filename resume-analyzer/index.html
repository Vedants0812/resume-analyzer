<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resume Analyzer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <header>
      <h1>Resume Analyzer</h1>
      <p class="subtitle">Paste your resume — get an instant score + suggestions.</p>
    </header>

    <!-- INPUT SECTION -->
    <div id="input-section">
      <textarea id="resume-input" placeholder="Paste your full resume text here...

Example:
John Doe | john@email.com | linkedin.com/in/johndoe | github.com/johndoe

Summary:
Passionate developer with 2 years of experience building web applications...

Skills:
JavaScript, React, Node.js, Python, Git, SQL, HTML, CSS

Experience:
Built 3 full-stack projects deployed on Netlify and Render...
Reduced page load time by 40% through code optimization...

Education:
B.Tech Computer Science — XYZ University, 2024"></textarea>
      <button class="btn-analyze" onclick="analyzeResume()">Analyze Resume →</button>
    </div>

    <!-- RESULTS SECTION -->
    <div id="results-section" style="display:none;">

      <div class="score-card">
        <div class="score-circle" id="score-circle">
          <span class="score-number" id="score-number">0</span>
          <span class="score-slash">/ 100</span>
        </div>
        <div class="score-info">
          <h2 id="score-grade">–</h2>
          <p id="score-desc">–</p>
        </div>
      </div>

      <h3 class="section-label">Breakdown</h3>
      <div class="bars" id="bars"></div>

      <h3 class="section-label">Suggestions</h3>
      <div class="suggestions" id="suggestions"></div>

      <h3 class="section-label">Keyword Check</h3>
      <p class="kw-hint">Green = found in resume &nbsp;|&nbsp; Red = missing (add these!)</p>
      <div class="keywords" id="keywords"></div>

      <button class="btn-reset" onclick="reset()">← Analyze Another Resume</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
